[package]
name = "mount-sso"
version = "0.1.2"
edition = "2024"
description = "Mount S3-compatible object storage as a macOS directory over a loopback NFSv3 server"
license = "MIT"
repository = "https://github.com/yunhai-dev/mount-sso"

[dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
libc = "0.2"
nfsserve = "0.11"
object_store = { version = "0.14", features = ["aws"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
